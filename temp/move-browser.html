<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Move Event Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #14161c;
  --panel:    #1b1e27;
  --panel-2:  #20232e;
  --border:   #2a2e3a;
  --text:     #e9e7de;
  --text-dim: #8b90a0;
  --text-faint:#565b6b;
  --accent:   #e3350d;
  --accent-dim:#7a2013;
  --gold:     #f2c245;
  --gold-dim: #4a3d1c;
  --ok:       #4caf7d;

  /* Type colours */
  --normal:#A8A878; --fire:#F08030; --water:#6890F0; --grass:#78C850;
  --electric:#F0C020; --ice:#98D8D8; --fighting:#C03028; --poison:#A040A0;
  --ground:#E0C068; --flying:#A890F0; --psychic:#F85888; --bug:#A8B820;
  --rock:#B8A038; --ghost:#705898; --dragon:#7038F8; --dark:#705848;
  --steel:#B8B8D0; --fairy:#EE99AC;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Space Grotesk', system-ui, sans-serif;
  font-size: 14px;
  overflow: hidden;
}
.mono { font-family: 'IBM Plex Mono', monospace; }

/* ── App shell ──────────────────────────────────────────────────────────── */
.app { display: flex; flex-direction: column; height: 100vh; }

.topbar {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 20px; border-bottom: 1px solid var(--border);
  background: var(--panel); flex-shrink: 0;
}
.topbar-mark {
  width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0;
  background: conic-gradient(from 180deg, var(--accent) 0 50%, #f4f4f4 50% 100%);
  border: 2px solid #0c0d10;
}
.topbar h1 { font-size: 14px; font-weight: 600; letter-spacing: 0.02em; }
.topbar-spacer { flex: 1; }
.topbar-actions { display: flex; gap: 6px; align-items: center; }

.layout {
  flex: 1; display: grid; grid-template-columns: 300px 1fr;
  min-height: 0; overflow: hidden;
}

/* ── Left panel ─────────────────────────────────────────────────────────── */
.movelist-panel {
  border-right: 1px solid var(--border);
  background: var(--panel);
  display: flex; flex-direction: column; min-height: 0; overflow: hidden;
}

.movelist-controls {
  padding: 12px 12px 0; display: flex; gap: 8px; flex-shrink: 0;
}
.search-wrap { position: relative; flex: 1; }
.search-wrap input {
  width: 100%; padding: 7px 10px 7px 28px;
  background: var(--panel-2); border: 1px solid var(--border);
  border-radius: 6px; color: var(--text);
  font-family: inherit; font-size: 13px;
}
.search-wrap input::placeholder { color: var(--text-faint); }
.search-wrap input:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
.search-wrap .search-icon {
  position: absolute; left: 8px; top: 50%; transform: translateY(-50%);
  width: 13px; height: 13px; stroke: var(--text-dim); pointer-events: none;
}

.filter-sel {
  padding: 7px 8px; background: var(--panel-2); border: 1px solid var(--border);
  border-radius: 6px; color: var(--text);
  font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; cursor: pointer;
}
.filter-sel:focus { outline: 1px solid var(--accent); border-color: var(--accent); }

.movelist-filters {
  padding: 8px 12px 10px; display: flex; gap: 8px; flex-shrink: 0;
  border-bottom: 1px solid var(--border);
}
.movelist-filters .filter-sel { flex: 1; }

.movelist { flex: 1; overflow-y: auto; }

.move-row {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 14px; cursor: pointer;
  border-bottom: 1px solid rgba(255,255,255,0.03);
  position: relative; user-select: none;
}
.move-row:hover { background: var(--panel-2); }
.move-row.active { background: var(--panel-2); }
.move-row.active::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0;
  width: 3px; background: var(--accent);
}
.type-tab { width: 7px; height: 24px; border-radius: 2px; flex-shrink: 0; }
.row-info { flex: 1; min-width: 0; }
.row-info .name {
  font-size: 13px; font-weight: 500; text-transform: capitalize;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.row-info .meta {
  font-size: 10.5px; color: var(--text-faint);
  font-family: 'IBM Plex Mono', monospace; margin-top: 1px;
}
.row-dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
  flex-shrink: 0; opacity: 0.8;
}

.movelist-footer {
  padding: 8px 14px; font-size: 11px; color: var(--text-faint);
  border-top: 1px solid var(--border);
  font-family: 'IBM Plex Mono', monospace; flex-shrink: 0;
}

.loading-state {
  padding: 32px 20px; text-align: center; color: var(--text-dim);
  font-family: 'IBM Plex Mono', monospace; font-size: 12px;
}
.loading-progress { margin-top: 8px; color: var(--text-faint); font-size: 11px; }

/* ── Right panel ────────────────────────────────────────────────────────── */
.editor { overflow-y: auto; min-height: 0; padding: 24px 28px 60px; }
.editor-empty {
  display: flex; align-items: center; justify-content: center;
  height: 100%; color: var(--text-faint);
  font-size: 13px; font-family: 'IBM Plex Mono', monospace;
}

/* Move header */
.move-header {
  display: flex; align-items: flex-start; gap: 20px; margin-bottom: 18px;
}
.move-title-block { flex: 1; min-width: 0; }
.move-title-block h2 {
  margin: 0 0 6px 0; font-size: 24px; font-weight: 700;
  letter-spacing: -0.01em; text-transform: capitalize;
}
.badge-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.type-badge {
  padding: 3px 9px; border-radius: 4px; font-size: 11px;
  font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;
  color: #161616;
}
.cat-badge {
  padding: 3px 9px; border-radius: 4px; font-size: 11px;
  border: 1px solid var(--border); color: var(--text-dim);
  font-family: 'IBM Plex Mono', monospace; text-transform: capitalize;
}

.stat-grid { display: flex; gap: 22px; flex-shrink: 0; }
.stat { text-align: right; }
.stat .val {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 19px; font-weight: 600;
}
.stat .lbl {
  font-size: 9.5px; color: var(--text-faint);
  text-transform: uppercase; letter-spacing: 0.06em; margin-top: 2px;
}

/* Description field */
.field-block { margin-bottom: 20px; }
.field-block label {
  display: block; font-size: 10.5px; text-transform: uppercase;
  letter-spacing: 0.06em; color: var(--text-faint); margin-bottom: 6px;
}
textarea.desc {
  width: 100%; min-height: 60px;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 6px; color: var(--text-dim); padding: 9px 11px;
  font-family: 'Space Grotesk', sans-serif; font-size: 13px;
  resize: vertical; line-height: 1.55;
}
textarea.desc:focus {
  outline: 1px solid var(--accent); border-color: var(--accent); color: var(--text);
}

/* ── Sections (Events / Conditions) ─────────────────────────────────────── */
.section {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 10px; margin-bottom: 16px; overflow: visible;
}
.section-head {
  display: flex; align-items: center; gap: 8px; padding: 12px 14px;
  border-bottom: 1px solid var(--border); position: relative;
}
.section-head h3 { margin: 0; font-size: 13.5px; font-weight: 600; }
.section-head .count {
  font-family: 'IBM Plex Mono', monospace; font-size: 10.5px;
  color: var(--text-faint); background: var(--panel-2);
  padding: 2px 6px; border-radius: 10px;
}
.section-head .spacer { flex: 1; }
.section-body { padding: 12px 14px; }
.empty-row {
  color: var(--text-faint); font-size: 12px; font-style: italic; padding: 8px 0;
}

/* ── Buttons ─────────────────────────────────────────────────────────────── */
.btn {
  border: none; border-radius: 6px; padding: 6px 11px;
  font-size: 12px; font-weight: 600; cursor: pointer;
  font-family: 'Space Grotesk', sans-serif;
  display: inline-flex; align-items: center; gap: 4px;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: #ff4419; }
.btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-dim); }
.btn-ghost:hover { border-color: var(--text-dim); color: var(--text); }
.btn-gold { background: transparent; border: 1px solid var(--gold-dim); color: var(--gold); }
.btn-gold:hover { background: var(--gold-dim); }
.btn-sm { padding: 5px 9px; font-size: 11.5px; }

/* ── Presets popover ─────────────────────────────────────────────────────── */
.presets-trigger {
  background: var(--panel-2); border: 1px solid var(--gold-dim); color: var(--gold);
  font-size: 11px; padding: 5px 9px; border-radius: 6px;
  font-family: 'IBM Plex Mono', monospace; cursor: pointer;
  display: inline-flex; align-items: center; gap: 5px;
}
.presets-trigger:hover { border-color: var(--gold); }
.presets-panel {
  display: none; position: absolute; top: calc(100% + 6px); right: 120px;
  width: 250px; background: var(--panel-2); border: 1px solid var(--gold-dim);
  border-radius: 8px; box-shadow: 0 12px 32px rgba(0,0,0,0.55);
  z-index: 30; overflow: hidden;
}
.presets-panel.open { display: block; }
.presets-panel .ph {
  padding: 8px 12px; font-size: 10px; text-transform: uppercase;
  letter-spacing: 0.06em; color: var(--gold);
  border-bottom: 1px solid var(--gold-dim); background: rgba(242,194,69,0.05);
  font-family: 'IBM Plex Mono', monospace;
}
.preset-item { padding: 9px 12px; cursor: pointer; border-bottom: 1px solid var(--border); }
.preset-item:last-child { border-bottom: none; }
.preset-item:hover { background: rgba(242,194,69,0.07); }
.preset-item .pname { font-size: 12px; font-weight: 600; margin-bottom: 4px; }
.preset-item .ptags { display: flex; gap: 4px; flex-wrap: wrap; }
.preset-empty { padding: 12px; font-size: 11.5px; color: var(--text-faint); font-style: italic; }

/* ── Item cards ──────────────────────────────────────────────────────────── */
.item-card {
  display: flex; align-items: center; gap: 10px; padding: 9px 11px;
  background: var(--panel-2); border: 1px solid var(--border);
  border-radius: 8px; margin-bottom: 7px;
}
.item-card:last-child { margin-bottom: 0; }
.item-card .idx {
  font-family: 'IBM Plex Mono', monospace; font-size: 10px;
  color: var(--text-faint); width: 20px; flex-shrink: 0;
}
.item-card .main { flex: 1; min-width: 0; }
.item-card .main .t1 { font-size: 12.5px; font-weight: 500; }
.item-card .main .t2 {
  font-size: 10.5px; color: var(--text-faint);
  font-family: 'IBM Plex Mono', monospace; margin-top: 2px;
}
.item-card .tags { display: flex; gap: 4px; flex-wrap: wrap; max-width: 180px; justify-content: flex-end; }
.mini-tag {
  font-size: 10px; padding: 2px 5px; border-radius: 3px;
  background: var(--panel); border: 1px solid var(--border);
  color: var(--text-dim); font-family: 'IBM Plex Mono', monospace;
  white-space: nowrap; max-width: 100px; overflow: hidden; text-overflow: ellipsis;
}
.icon-btn {
  background: none; border: 1px solid var(--border); color: var(--text-faint);
  cursor: pointer; width: 26px; height: 26px; border-radius: 6px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.icon-btn:hover { border-color: var(--text-dim); color: var(--text); }
.icon-btn.danger:hover { border-color: var(--accent); color: var(--accent); }
.icon-btn svg { width: 12px; height: 12px; }

/* ── Modals ──────────────────────────────────────────────────────────────── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(8,9,12,0.78);
  display: none; align-items: center; justify-content: center;
  z-index: 100; padding: 20px;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 12px; width: 500px; max-width: 100%; max-height: 88vh;
  display: flex; flex-direction: column; overflow: hidden;
  box-shadow: 0 24px 64px rgba(0,0,0,0.65);
}
.modal-head {
  padding: 14px 18px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
}
.modal-head h3 { margin: 0; font-size: 14px; font-weight: 600; }
.modal-head .close {
  margin-left: auto; background: none; border: none;
  color: var(--text-faint); font-size: 20px; cursor: pointer; line-height: 1;
}
.modal-head .close:hover { color: var(--text); }
.modal-body { padding: 16px 18px; overflow-y: auto; }
.modal-foot {
  padding: 12px 18px; border-top: 1px solid var(--border);
  display: flex; justify-content: flex-end; gap: 8px;
}

.form-row { margin-bottom: 14px; }
.form-row label {
  display: block; font-size: 10.5px; text-transform: uppercase;
  letter-spacing: 0.05em; color: var(--text-faint); margin-bottom: 5px;
}
.form-row input[type=text],
.form-row input[type=number],
.form-row select {
  width: 100%; background: var(--panel-2); border: 1px solid var(--border);
  border-radius: 6px; padding: 8px 10px; color: var(--text);
  font-family: 'IBM Plex Mono', monospace; font-size: 12.5px;
}
.form-row input:focus,
.form-row select:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.param-head {
  display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
}
.param-head label {
  font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em;
  color: var(--text-faint); margin: 0;
}
.param-row { display: flex; gap: 7px; margin-bottom: 7px; }
.param-row input {
  flex: 1; background: var(--panel-2); border: 1px solid var(--border);
  border-radius: 6px; padding: 7px 8px; color: var(--text);
  font-family: 'IBM Plex Mono', monospace; font-size: 12px;
}
.param-row input:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
.param-row .rm {
  background: none; border: 1px solid var(--border); color: var(--text-faint);
  border-radius: 6px; width: 30px; cursor: pointer; font-size: 15px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.param-row .rm:hover { border-color: var(--accent); color: var(--accent); }
.add-param-btn {
  background: none; border: 1px dashed var(--border); color: var(--text-dim);
  border-radius: 6px; padding: 8px; width: 100%; cursor: pointer;
  font-size: 12px; font-family: 'Space Grotesk', sans-serif; margin-top: 2px;
}
.add-param-btn:hover { border-color: var(--accent); color: var(--accent); }

/* Save-preset modal */
.savepage-section { margin-bottom: 16px; }
.savepage-section .sp-label {
  font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--text-faint); margin-bottom: 8px; display: block;
}
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; min-height: 26px; }
.chip {
  padding: 4px 9px; border-radius: 12px; background: var(--panel-2);
  border: 1px solid var(--border); font-size: 11px; color: var(--text-dim);
  font-family: 'IBM Plex Mono', monospace;
}
.chip.evt { border-color: var(--accent-dim); color: #ffb3a0; }
.chip.cond { border-color: var(--gold-dim); color: var(--gold); }
.preset-name-input {
  width: 100%; background: var(--panel-2); border: 1px solid var(--border);
  border-radius: 6px; padding: 9px 11px; color: var(--text);
  font-family: 'IBM Plex Mono', monospace; font-size: 13px;
}
.preset-name-input:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
.input-error { border-color: var(--accent) !important; }
.error-msg { display: none; color: var(--accent); font-size: 11px; margin-top: 5px; }

/* scrollbar */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: #2c303c; border-radius: 6px; }
::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>

<div class="app">
  <!-- Top bar -->
  <div class="topbar">
    <div class="topbar-mark"></div>
    <h1>Move Event Editor</h1>
    <div class="topbar-spacer"></div>
    <div class="topbar-actions">
      <button class="btn btn-ghost btn-sm" id="exportBtn">↓ Export JSON</button>
      <label class="btn btn-ghost btn-sm" style="cursor:pointer;">
        ↑ Import JSON
        <input type="file" id="importFile" accept=".json" style="display:none">
      </label>
    </div>
  </div>

  <div class="layout">
    <!-- LEFT: move list -->
    <div class="movelist-panel">
      <div class="movelist-controls">
        <div class="search-wrap">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke-width="2.5">
            <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input id="searchInput" type="text" placeholder="Search moves…">
        </div>
        <select id="genFilter" class="filter-sel">
          <option value="all">ALL</option>
          <option value="1">GEN 1</option>
          <option value="2">GEN 2</option>
          <option value="3">GEN 3</option>
          <option value="4">GEN 4</option>
          <option value="5">GEN 5</option>
          <option value="6">GEN 6</option>
          <option value="7">GEN 7</option>
          <option value="8">GEN 8</option>
          <option value="9">GEN 9</option>
        </select>
      </div>
      <div class="movelist-filters">
        <select id="typeFilter" class="filter-sel">
          <option value="all">All Types</option>
        </select>
        <select id="catFilter" class="filter-sel">
          <option value="all">All Moves</option>
          <option value="standard">Standard</option>
          <option value="z">Z-Moves</option>
          <option value="max">Max / G-Max</option>
          <option value="partner">Partner Moves</option>
        </select>
      </div>
      <div class="movelist" id="moveList">
        <div class="loading-state">
          Loading moves from PokeAPI…
          <div class="loading-progress" id="loadProgress"></div>
        </div>
      </div>
      <div class="movelist-footer mono" id="moveCount">— moves</div>
    </div>

    <!-- RIGHT: editor -->
    <div class="editor" id="editorPanel">
      <div class="editor-empty mono">← Select a move to begin</div>
    </div>
  </div>
</div>

<!-- MODAL: Create / Edit Event -->
<div class="modal-overlay" id="eventModal">
  <div class="modal">
    <div class="modal-head">
      <h3 id="eventModalTitle">Create Event</h3>
      <button class="close" data-close="eventModal">&times;</button>
    </div>
    <div class="modal-body">
      <div class="two-col">
        <div class="form-row">
          <label>Target</label>
          <select id="targetSelect">
            <option>Self</option>
            <option>Target</option>
            <option>All Pokémon</option>
            <option>Opposite Field</option>
          </select>
        </div>
        <div class="form-row">
          <label>Priority</label>
          <input type="number" id="eventPriority" value="0">
        </div>
      </div>
      <div class="param-head"><label>Additional Parameters</label></div>
      <div id="eventParamRows"></div>
      <button class="add-param-btn" id="addEventParamBtn">+ Add Parameter</button>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" data-close="eventModal">Cancel</button>
      <button class="btn btn-primary" id="saveEventBtn">Save Event</button>
    </div>
  </div>
</div>

<!-- MODAL: Create / Edit Condition -->
<div class="modal-overlay" id="condModal">
  <div class="modal">
    <div class="modal-head">
      <h3 id="condModalTitle">Create Condition</h3>
      <button class="close" data-close="condModal">&times;</button>
    </div>
    <div class="modal-body">
      <div class="param-head"><label>Condition Parameters</label></div>
      <div id="condParamRows"></div>
      <button class="add-param-btn" id="addCondParamBtn">+ Add Parameter</button>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" data-close="condModal">Cancel</button>
      <button class="btn btn-primary" id="saveCondBtn">Save Condition</button>
    </div>
  </div>
</div>

<!-- MODAL: Save as Preset -->
<div class="modal-overlay" id="presetModal">
  <div class="modal" style="width:460px;">
    <div class="modal-head">
      <h3>Save as Preset</h3>
      <button class="close" data-close="presetModal">&times;</button>
    </div>
    <div class="modal-body">
      <div class="savepage-section">
        <span class="sp-label">Name <span style="color:var(--accent)">*</span></span>
        <input class="preset-name-input" type="text" id="presetNameInput" placeholder="Name this preset…">
        <div class="error-msg" id="presetNameError">A name is required.</div>
      </div>
      <div class="savepage-section">
        <span class="sp-label">Events</span>
        <div class="chip-row" id="presetEventChips"></div>
      </div>
      <div class="savepage-section" style="margin-bottom:0">
        <span class="sp-label">Conditions</span>
        <div class="chip-row" id="presetCondChips"></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" data-close="presetModal">Cancel</button>
      <button class="btn btn-gold" id="confirmPresetBtn">Save</button>
    </div>
  </div>
</div>

<script>
'use strict';

// ── Constants ────────────────────────────────────────────────────────────────

const TYPE_COLORS = {
  normal:'#A8A878', fire:'#F08030',  water:'#6890F0',  electric:'#F8D030',
  grass:'#78C850',  ice:'#98D8D8',   fighting:'#C03028',poison:'#A040A0',

// ── Storage ──────────────────────────────────────────────────────────────────

const STORAGE_KEY = 'pokemon_sim_move_editor_v1';

function loadStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : { moveData: {}, presets: [] };
  } catch { return { moveData: {}, presets: [] }; }
}

function saveStorage() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(storage));
}

let storage = loadStorage();

// ── App state ────────────────────────────────────────────────────────────────

let allMoves     = [];
let filtered     = [];
let selectedMove = null;
let curEvents    = [];
let curConds     = [];

// ── Helpers ──────────────────────────────────────────────────────────────────

function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

function fmtName(name) {
  return name.split('-').map(cap).join(' ');
}

function esc(s) {
  return String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function getMoveCategory(name) {
  if (Z_MOVES.has(name))       return 'z';
  if (MAX_MOVES.has(name))     return 'max';
  if (PARTNER_MOVES.has(name)) return 'partner';
  // PokeAPI returns typed Z-moves as variants, e.g. "acid-downpour-physical"
  // and "acid-downpour--special" (single or double dash before the suffix).
  // Strip the suffix and re-check against the Z_MOVES base names.
  const base = name.replace(/-{1,2}(physical|special)$/, '');
  if (base !== name && Z_MOVES.has(base)) return 'z';
  return 'standard';
}

function moveHasData(moveName) {
  const d = storage.moveData[moveName];
  return d && ((d.events && d.events.length > 0) || (d.conds && d.conds.length > 0));
}

// ── PokeAPI fetch ────────────────────────────────────────────────────────────

async function fetchMoves() {
  const progress = document.getElementById('loadProgress');
  progress.textContent = 'Fetching move index…';

  const listRes  = await fetch('https://pokeapi.co/api/v2/move?limit=1000');
  const listData = await listRes.json();
  const urls     = listData.results;

  const moves    = [];
  const types    = new Set();
  const batch    = 50;

  for (let i = 0; i < urls.length; i += batch) {
    const slice = urls.slice(i, i + batch);
    progress.textContent = `Loading ${Math.min(i + batch, urls.length)} / ${urls.length}…`;

    const results = await Promise.all(slice.map(async m => {
      try { const r = await fetch(m.url); return await r.json(); }
      catch { return null; }
    }));

    for (const data of results) {
      if (!data) continue;
      const name = data.name;
      const type = data.type?.name || 'normal';
      types.add(type);

      let effect = '';
      for (const e of (data.effect_entries || [])) {
        if (e.language?.name === 'en') { effect = e.short_effect || e.effect || ''; break; }
      }

      moves.push({
        name,
        displayName:  fmtName(name),
        type,
        power:        data.power,
        pp:           data.pp,
        priority:     data.priority || 0,
        damage_class: data.damage_class?.name || 'status',
        effect,
        generation:   GEN_MAP[data.generation?.name] || 1,
        moveCat:      getMoveCategory(name),
      });
    }
  }

  // Populate type filter
  const tf = document.getElementById('typeFilter');
  [...types].sort().forEach(t => {
    const o = document.createElement('option');
    o.value = t; o.textContent = cap(t);
    tf.appendChild(o);
  });

  return mergeZMoveVariants(moves);
}

// ── Z-move variant merging ───────────────────────────────────────────────────

function mergeZMoveVariants(moves) {
  const variantRe = /-{1,2}(physical|special)$/;
  const groups  = {};
  const result  = [];

  for (const m of moves) {
    if (m.moveCat !== 'z') { result.push(m); continue; }
    const match = m.name.match(variantRe);
    if (!match) { result.push(m); continue; }          // unique z-move, no variant
    const base = m.name.replace(variantRe, '');
    if (!groups[base]) groups[base] = [];
    groups[base].push(m);
  }

  for (const [base, variants] of Object.entries(groups)) {
    const ref = variants[0];
    result.push({
      name:         base,
      displayName:  fmtName(base),
      type:         ref.type,
      power:        ref.power,
      pp:           ref.pp,
      priority:     ref.priority,
      damage_class: 'both',
      effect:       ref.effect,
      generation:   ref.generation,
      moveCat:      'z',
    });
  }

  return result.sort((a, b) => a.name.localeCompare(b.name));
}

// ── Filtering ────────────────────────────────────────────────────────────────

function applyFilters() {
  const q   = document.getElementById('searchInput').value.toLowerCase();
  const gen = document.getElementById('genFilter').value;
  const typ = document.getElementById('typeFilter').value;
  const cat = document.getElementById('catFilter').value;

  filtered = allMoves.filter(m => {
    if (gen !== 'all' && m.generation !== parseInt(gen)) return false;
    if (typ !== 'all' && m.type !== typ) return false;

    if (cat === 'z')             { if (m.moveCat !== 'z')        return false; }
    else if (cat === 'max')      { if (m.moveCat !== 'max')      return false; }
    else if (cat === 'partner')  { if (m.moveCat !== 'partner')  return false; }
    else if (cat === 'standard') { if (m.moveCat !== 'standard') return false; }

    if (q && !m.name.includes(q) && !m.displayName.toLowerCase().includes(q) && !m.type.includes(q)) return false;
    return true;
  });

  renderMoveList();
}

// ── Move list rendering ──────────────────────────────────────────────────────

function renderMoveList() {
  const listEl = document.getElementById('moveList');
  document.getElementById('moveCount').textContent =
    `${filtered.length} move${filtered.length !== 1 ? 's' : ''}`;

  if (filtered.length === 0) {
    listEl.innerHTML = '<div class="loading-state">No moves found.</div>';
    return;
  }

  listEl.innerHTML = '';
  for (const m of filtered) {
    const color    = TYPE_COLORS[m.type] || '#888';
    const isActive = selectedMove && m.name === selectedMove.name;
    const hasDot   = moveHasData(m.name);

    const row = document.createElement('div');
    row.className = 'move-row' + (isActive ? ' active' : '');
    row.innerHTML = `
      <div class="type-tab" style="background:${color}"></div>
      <div class="row-info">
        <div class="name">${esc(m.displayName)}</div>
        <div class="meta">${m.type.toUpperCase()} · ${m.damage_class === 'both' ? 'PHYS / SPEC' : m.damage_class.toUpperCase()}</div>
      </div>
      ${hasDot ? '<div class="row-dot" title="Has saved events/conditions"></div>' : ''}
    `;
    row.addEventListener('click', () => selectMove(m));
    listEl.appendChild(row);
  }

  // Scroll active row into view
  const activeEl = listEl.querySelector('.move-row.active');
  if (activeEl) activeEl.scrollIntoView({ block: 'nearest' });
}

// ── Move selection ───────────────────────────────────────────────────────────

function selectMove(move) {
  selectedMove = move;
  const saved  = storage.moveData[move.name] || {};
  curEvents    = deepClone(saved.events || []);
  curConds     = deepClone(saved.conds  || []);
  renderEditor();
  renderMoveList();
}

function deepClone(arr) {
  return arr.map(item => ({
    ...item,
    params: (item.params || []).map(p => ({ ...p }))
  }));
}

function persistCurrent() {
  if (!selectedMove) return;
  if (!storage.moveData[selectedMove.name]) storage.moveData[selectedMove.name] = {};
  storage.moveData[selectedMove.name].events = curEvents;
  storage.moveData[selectedMove.name].conds  = curConds;
  saveStorage();
  // Update dot on the active row without a full re-render
  const listEl = document.getElementById('moveList');
  const active = listEl.querySelector('.move-row.active');
  if (active) {
    const hasDot = moveHasData(selectedMove.name);
    let dot = active.querySelector('.row-dot');
    if (hasDot && !dot) {
      dot = document.createElement('div');
      dot.className = 'row-dot';
      dot.title = 'Has saved events/conditions';
      active.appendChild(dot);
    } else if (!hasDot && dot) {
      dot.remove();
    }
  }
}

}

function bindEditorListeners() {
  // Description auto-save (debounced)
  let descTimer = null;
  document.getElementById('descBox').addEventListener('input', e => {
    clearTimeout(descTimer);
    descTimer = setTimeout(() => {
      if (!storage.moveData[selectedMove.name]) storage.moveData[selectedMove.name] = {};
      storage.moveData[selectedMove.name].customDesc = e.target.value;
      saveStorage();
    }, 600);
  });

  document.getElementById('addEventBtn').addEventListener('click', () => openEventModal(null));
  document.getElementById('addCondBtn').addEventListener('click',  () => openCondModal(null));
  document.getElementById('savePresetBtn').addEventListener('click', openPresetModal);

  // Presets popover — use a named, re-attachable handler
  const trigger = document.getElementById('presetsTrigger');
  const panel   = document.getElementById('presetsPanel');
  trigger.addEventListener('click', e => {
    e.stopPropagation();
    renderPresetsList();
    panel.classList.toggle('open');
  });
}

// Close presets panel when clicking outside (single global handler, cheap check)
document.addEventListener('click', () => {
  const panel = document.getElementById('presetsPanel');
  if (panel) panel.classList.remove('open');
});

// ── Events section ───────────────────────────────────────────────────────────

function renderEvents() {
  const countEl = document.getElementById('eventCount');
  const body    = document.getElementById('eventsBody');
  if (!countEl || !body) return;
  countEl.textContent = curEvents.length;

  if (curEvents.length === 0) {
    body.innerHTML = '<div class="empty-row">No events yet. Click "+ Add Event" or apply a preset.</div>';
    return;
  }

  body.innerHTML = '';
  curEvents.forEach((ev, i) => {
    const tags = ev.params.slice(0, 3)
      .map(p => `<span class="mini-tag">${esc(p.key)}: ${esc(p.val)}</span>`).join('');
    const card = document.createElement('div');
    card.className = 'item-card';
    card.innerHTML = `
      <div class="idx">${String(i+1).padStart(2,'0')}</div>
      <div class="main">
        <div class="t1">Target: ${esc(ev.target)}</div>
        <div class="t2">priority ${esc(String(ev.priority))} · ${ev.params.length} param${ev.params.length !== 1 ? 's' : ''}</div>
      </div>
      <div class="tags">${tags}</div>
      <button class="icon-btn" title="Edit">${PENCIL_SVG}</button>
      <button class="icon-btn danger" title="Delete">${TRASH_SVG}</button>
    `;
    card.querySelectorAll('.icon-btn')[0].addEventListener('click', () => openEventModal(i));
    card.querySelectorAll('.icon-btn')[1].addEventListener('click', () => {
      curEvents.splice(i, 1);
      persistCurrent();
      renderEvents();
    });
    body.appendChild(card);
  });
}

// ── Modal helpers ────────────────────────────────────────────────────────────

function openModal(id)  { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

// data-close attribute & backdrop click
document.addEventListener('click', e => {
  if (e.target.dataset.close) { closeModal(e.target.dataset.close); return; }
  if (e.target.classList.contains('modal-overlay')) { e.target.classList.remove('open'); }
});

// Escape key closes topmost open modal
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  const open = document.querySelector('.modal-overlay.open');
  if (open) open.classList.remove('open');
});

// ── Event modal ──────────────────────────────────────────────────────────────

let evtParams      = [];
let editingEvtIdx  = null;

function renderEvtParamRows() {
  const container = document.getElementById('eventParamRows');
  container.innerHTML = '';
  evtParams.forEach((p, i) => {
    const row = document.createElement('div');
    row.className = 'param-row';
    row.innerHTML = `
      <input type="text" placeholder="Key (e.g. Type)" value="${esc(p.key)}" data-field="key" data-i="${i}">
      <input type="text" placeholder="Value" value="${esc(p.val)}" data-field="val" data-i="${i}">
      <button class="rm">&times;</button>
    `;
    row.querySelectorAll('input').forEach(inp => {
      inp.addEventListener('input', e => { evtParams[e.target.dataset.i][e.target.dataset.field] = e.target.value; });
    });
    row.querySelector('.rm').addEventListener('click', () => { evtParams.splice(i, 1); renderEvtParamRows(); });
    container.appendChild(row);
  });
}

function openEventModal(editIdx) {
  editingEvtIdx = editIdx;
  if (editIdx === null) {
    document.getElementById('eventModalTitle').textContent = 'Create Event';
    document.getElementById('targetSelect').value = 'Self';
    document.getElementById('eventPriority').value = 0;
    evtParams = [];
  } else {
    const ev = curEvents[editIdx];
    document.getElementById('eventModalTitle').textContent = 'Edit Event';
    document.getElementById('targetSelect').value = ev.target;
    document.getElementById('eventPriority').value = ev.priority;
    evtParams = ev.params.map(p => ({ ...p }));
  }
  renderEvtParamRows();
  openModal('eventModal');
}

document.getElementById('addEventParamBtn').addEventListener('click', () => {
  evtParams.push({ key: '', val: '' });
  renderEvtParamRows();
});

document.getElementById('saveEventBtn').addEventListener('click', () => {
  const record = {
    target:   document.getElementById('targetSelect').value,
    priority: document.getElementById('eventPriority').value,
    params:   evtParams.filter(p => p.key.trim() !== '')
  };
  if (editingEvtIdx === null) { curEvents.push(record); }
  else { curEvents[editingEvtIdx] = record; }
  persistCurrent();
  renderEvents();
  closeModal('eventModal');
});

  openModal('condModal');
}

document.getElementById('addCondParamBtn').addEventListener('click', () => {
  condParams.push({ key: '', val: '' });
  renderCondParamRows();
});

document.getElementById('saveCondBtn').addEventListener('click', () => {
  const record = { params: condParams.filter(p => p.key.trim() !== '') };
  if (editingCondIdx === null) { curConds.push(record); }
  else { curConds[editingCondIdx] = record; }
  persistCurrent();
  renderConds();
  closeModal('condModal');
});

// ── Presets popover ──────────────────────────────────────────────────────────

function renderPresetsList() {
  const list    = document.getElementById('presetsList');
  if (!list) return;
  const presets = storage.presets || [];

  if (presets.length === 0) {
    list.innerHTML = '<div class="preset-empty">No presets saved yet.</div>';
    return;
  }

  list.innerHTML = '';
  presets.forEach((p, i) => {
    const chips = p.events.length
      ? p.events.map(ev => `<span class="mini-tag">${esc(ev.target)}</span>`).join('')
      : '<span class="mini-tag">no events</span>';

    const item = document.createElement('div');
    item.className = 'preset-item';
    item.innerHTML = `<div class="pname">${esc(p.name)}</div><div class="ptags">${chips}</div>`;
    item.addEventListener('click', () => applyPreset(i));
    list.appendChild(item);
  });
}

function applyPreset(i) {
  const p  = storage.presets[i];
  curEvents = deepClone(p.events);
  curConds  = deepClone(p.conds || []);
  persistCurrent();
  renderEvents();
  renderConds();
  const panel = document.getElementById('presetsPanel');
  if (panel) panel.classList.remove('open');
}

// ── Save-preset modal ────────────────────────────────────────────────────────

function openPresetModal() {
  document.getElementById('presetNameInput').value = '';
  document.getElementById('presetNameInput').classList.remove('input-error');
  document.getElementById('presetNameError').style.display = 'none';

  const evChips   = document.getElementById('presetEventChips');
  const condChips = document.getElementById('presetCondChips');

  evChips.innerHTML = curEvents.length
    ? curEvents.map(ev => `<span class="chip evt">${esc(ev.target)}</span>`).join('')
    : '<span class="chip">none</span>';

  condChips.innerHTML = curConds.length
    ? curConds.map((_, i) => `<span class="chip cond">Condition ${i+1}</span>`).join('')
    : '<span class="chip">none</span>';

  openModal('presetModal');
  setTimeout(() => document.getElementById('presetNameInput').focus(), 50);
}

document.getElementById('presetNameInput').addEventListener('input', e => {
  if (e.target.value.trim()) {
    e.target.classList.remove('input-error');
    document.getElementById('presetNameError').style.display = 'none';
  }
});

document.getElementById('confirmPresetBtn').addEventListener('click', () => {
  const nameInput = document.getElementById('presetNameInput');
  const name      = nameInput.value.trim();
  if (!name) {
    nameInput.classList.add('input-error');
    document.getElementById('presetNameError').style.display = 'block';
    nameInput.focus();
    return;
  }
  if (!storage.presets) storage.presets = [];
  storage.presets.push({
    name,
    events: deepClone(curEvents),
    conds:  deepClone(curConds)
  });
  saveStorage();
  closeModal('presetModal');
});

// ── Export / Import ──────────────────────────────────────────────────────────

document.getElementById('exportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(storage, null, 2)], { type: 'application/json' });
  const a    = document.createElement('a');
  a.href     = URL.createObjectURL(blob);
  a.download = 'move_event_data.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
});

document.getElementById('importFile').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const imported = JSON.parse(ev.target.result);
      if (typeof imported !== 'object' || (!imported.moveData && !imported.presets)) {
        alert('Invalid data file — expected { moveData, presets }.'); return;
      }
      // Full replace (user exported their own data)
      storage = {
        moveData: imported.moveData || {},
        presets:  imported.presets  || []
      };
      saveStorage();
      if (selectedMove) selectMove(selectedMove); // reload editor
      renderMoveList();
      alert('Data imported successfully!');
    } catch { alert('Failed to parse JSON file.'); }
  };
  reader.readAsText(file);
  e.target.value = ''; // allow re-importing same file
});

// ── Keyboard navigation ──────────────────────────────────────────────────────

document.addEventListener('keydown', e => {
  // Don't intercept when typing in an input / textarea
  if (['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)) return;
  // Don't intercept when a modal is open
  if (document.querySelector('.modal-overlay.open')) return;
  if (!filtered.length) return;

  const idx = selectedMove ? filtered.findIndex(m => m.name === selectedMove.name) : -1;
  if ((e.key === 'ArrowDown' || e.key === 'j') && idx < filtered.length - 1) {
    e.preventDefault(); selectMove(filtered[idx + 1]);
  }
  if ((e.key === 'ArrowUp' || e.key === 'k') && idx > 0) {
    e.preventDefault(); selectMove(filtered[idx - 1]);
  }
});

// ── Wire up filters ──────────────────────────────────────────────────────────

document.getElementById('searchInput').addEventListener('input',  applyFilters);
document.getElementById('genFilter').addEventListener('change',   applyFilters);
document.getElementById('typeFilter').addEventListener('change',  applyFilters);
document.getElementById('catFilter').addEventListener('change',   applyFilters);

// ── Boot ─────────────────────────────────────────────────────────────────────

fetchMoves()
  .then(moves => {
    allMoves = moves;
    applyFilters();
    if (filtered.length > 0) selectMove(filtered[0]);
  })
  .catch(err => {
    document.getElementById('moveList').innerHTML =
      `<div class="loading-state">Failed to load: ${esc(err.message)}<br>Check your internet connection.</div>`;
  });
</script>
</body>
</html>
